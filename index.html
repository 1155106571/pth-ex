<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>普通話詞語通 · Putonghua Phrase Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-paper: #F7F5F0;
      --card-bg: #FFFFFF;
      --ink: #1E293B;
      --accent: #E05A47;
      --accent-dark: #C84735;
      --jade: #2A8C82;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-paper);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    .zh-font {
      font-family: 'Noto Sans TC', 'Noto Sans SC', 'PingFang TC', 'PingFang SC', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(180deg, #EB6A57 0%, #D94E3B 100%);
      box-shadow: 0 3px 0 #B33B2A, 0 6px 14px rgba(217, 78, 59, 0.25);
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.15s ease;
    }
    .btn-primary:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #B33B2A, 0 2px 6px rgba(217, 78, 59, 0.2);
    }

    .btn-jade {
      background: linear-gradient(180deg, #32A196 0%, #247E75 100%);
      box-shadow: 0 3px 0 #1B6059, 0 6px 14px rgba(42, 140, 130, 0.22);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-jade:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1B6059, 0 2px 6px rgba(42, 140, 130, 0.18);
    }

    .btn-soft {
      background: #FFFFFF;
      border: 1.5px solid #E5E2DC;
      box-shadow: 0 2px 0 #E5E2DC;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }
    .btn-soft:active:not(:disabled) {
      transform: translateY(1px);
      background-color: #F3F1EC;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96) translateY(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .animate-shake {
      animation: shake 0.32s ease-in-out;
    }

    .flash-blur {
      filter: blur(11px);
      user-select: none;
      opacity: 0.35;
      transition: filter 0.35s ease, opacity 0.35s ease;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Prevent iOS Safari auto-zoom on inputs */
    input[type="text"] {
      font-size: 16px !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ==================== TOP APP BAR ==================== -->
  <header class="sticky top-0 z-30 bg-[#F7F5F0]/95 backdrop-blur-md border-b border-[#E7E5E0]">
    <div class="max-w-xl mx-auto px-3.5 py-2.5 flex items-center justify-between gap-2">
      <button type="button" onclick="goHome()" class="flex items-center gap-2 text-left active:opacity-75 transition">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#E05A47] to-[#C84735] text-white flex items-center justify-center font-bold text-lg shadow-sm zh-font">
          普
        </div>
        <div class="leading-tight">
          <h1 class="font-extrabold text-sm sm:text-base tracking-tight text-slate-800 zh-font" data-trad="普通話詞語通" data-simp="普通话词语通">普通話詞語通</h1>
          <p class="text-[11px] text-slate-500 font-medium">Putonghua Phrase Master</p>
        </div>
      </button>

      <div class="flex items-center gap-1.5">
        <!-- Script Switcher: Traditional / Simplified -->
        <button id="scriptToggleBtn" type="button" onclick="toggleScript()"
          class="px-2.5 py-1.5 rounded-xl bg-white border border-[#E5E2DC] text-xs font-bold text-slate-700 active:scale-95 transition zh-font shadow-sm">
          繁 / <span class="text-slate-400 font-normal">简</span>
        </button>

        <!-- Sound FX Mute Toggle -->
        <button id="sfxToggleBtn" type="button" onclick="toggleSfx()"
          class="w-8 h-8 rounded-xl bg-white border border-[#E5E2DC] flex items-center justify-center text-slate-600 active:scale-95 transition shadow-sm"
          aria-label="Toggle Sound Effects">
          🔊
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTAINER ==================== -->
  <main class="flex-1 w-full max-w-xl mx-auto px-3.5 py-3.5 pb-10">

    <!-- ==================== VIEW 1: HOME (MIXED TOPICS) ==================== -->
    <section id="homeView" class="space-y-3.5 animate-pop">

      <!-- Practice Mode Card -->
      <div class="bg-white rounded-2xl p-3.5 border border-[#E7E5E0] shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400" data-trad="練習模式" data-simp="练习模式">練習模式</span>
          <span id="modeHintText" class="text-[11px] font-medium text-[#2A8C82]"></span>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button id="modeBtn-pinyin" type="button" onclick="setMode('pinyin')"
            class="mode-btn flex flex-col items-center justify-center py-2.5 px-1.5 rounded-xl border-2 transition text-center">
            <span class="text-lg mb-0.5">⌨️</span>
            <span class="text-xs font-bold zh-font" data-trad="拼音輸入" data-simp="拼音输入">拼音輸入</span>
            <span class="text-[10px] opacity-75">ni3 hao3</span>
          </button>

          <button id="modeBtn-typing" type="button" onclick="setMode('typing')"
            class="mode-btn flex flex-col items-center justify-center py-2.5 px-1.5 rounded-xl border-2 transition text-center">
            <span class="text-lg mb-0.5">✍️</span>
            <span class="text-xs font-bold zh-font" data-trad="中文打字" data-simp="中文打字">中文打字</span>
            <span class="text-[10px] opacity-75" data-trad="輸入法練習" data-simp="输入法练习">輸入法練習</span>
          </button>

          <button id="modeBtn-listening" type="button" onclick="setMode('listening')"
            class="mode-btn flex flex-col items-center justify-center py-2.5 px-1.5 rounded-xl border-2 transition text-center">
            <span class="text-lg mb-0.5">🎧</span>
            <span class="text-xs font-bold zh-font" data-trad="聽寫挑戰" data-simp="听写挑战">聽寫挑戰</span>
            <span class="text-[10px] opacity-75" data-trad="拼音或漢字" data-simp="拼音或汉字">拼音或漢字</span>
          </button>
        </div>

        <!-- Tone Requirement Toggle (Pinyin / Listening) -->
        <div id="toneOptionRow" class="flex items-center justify-between pt-2.5 border-t border-slate-100">
          <div class="text-xs">
            <span class="font-bold text-slate-700 zh-font" data-trad="要求聲調數字" data-simp="要求声调数字">要求聲調數字</span>
            <span class="text-slate-400 ml-1" data-trad="(如 wo3)" data-simp="(如 wo3)">(如 wo3)</span>
          </div>
          <button id="homeToneToggle" type="button" onclick="toggleRequireTones()"
            class="px-3 py-1 rounded-full text-xs font-bold transition"></button>
        </div>

        <!-- Flash Memory Toggle (Chinese Typing) -->
        <div id="flashOptionRow" class="hidden flex items-center justify-between pt-2.5 border-t border-slate-100">
          <div class="text-xs">
            <span class="font-bold text-slate-700 zh-font" data-trad="記憶閃現模式" data-simp="记忆闪现模式">記憶閃現模式</span>
            <span class="text-slate-400 ml-1" data-trad="(2秒後模糊)" data-simp="(2秒后模糊)">(2秒後模糊)</span>
          </div>
          <button id="homeFlashToggle" type="button" onclick="toggleFlashMode()"
            class="px-3 py-1 rounded-full text-xs font-bold transition"></button>
        </div>
      </div>

      <!-- Mixed Topics Builder Card (Primary Interface) -->
      <div class="bg-white rounded-2xl p-4 border border-[#E7E5E0] shadow-sm space-y-3.5">
        <div class="flex items-start justify-between gap-2">
          <div>
            <h2 class="text-sm sm:text-base font-extrabold text-slate-800 zh-font" data-trad="🔀 綜合混練 · 選擇主題" data-simp="🔀 综合混练 · 选择主题">🔀 綜合混練 · 選擇主題</h2>
            <p class="text-xs text-slate-500 mt-0.5" data-trad="點選 1 個主題專項練習，或勾選多個主題隨機混練" data-simp="点选 1 个主题专项练习，或勾选多个主题随机混练">點選 1 個主題專項練習，或勾選多個主題隨機混練</p>
          </div>
          <span id="mixPoolBadge" class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-[#2A8C82]/10 text-[#2A8C82] shrink-0 tabular-nums">
            0 詞
          </span>
        </div>

        <!-- Search + Quick Presets -->
        <div class="space-y-2">
          <input
            id="topicSearchInput"
            type="text"
            oninput="setTopicSearch(this.value)"
            placeholder="搜尋主題，如 數字、食物、香港地鐵、成語..."
            class="w-full bg-[#F8F7F4] border border-[#E7E5E0] focus:bg-white focus:border-[#2A8C82] focus:outline-none rounded-xl px-3.5 py-2 text-sm text-slate-700 placeholder:text-slate-400 transition"
          />

          <div class="flex flex-wrap items-center gap-1.5">
            <button type="button" onclick="selectMixPreset('all')"
              class="px-2.5 py-1.5 rounded-lg bg-[#F3F1EC] hover:bg-[#EAE7E0] text-slate-700 text-xs font-semibold active:scale-95 transition zh-font"
              data-trad="全選 (25)" data-simp="全选 (25)">全選 (25)</button>
            <button type="button" onclick="selectMixPreset('daily')"
              class="px-2.5 py-1.5 rounded-lg bg-[#F3F1EC] hover:bg-[#EAE7E0] text-slate-700 text-xs font-semibold active:scale-95 transition zh-font"
              data-trad="☀️ 日常精選" data-simp="☀️ 日常精选">☀️ 日常精選</button>
            <button type="button" onclick="selectMixPreset('random5')"
              class="px-2.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-semibold active:scale-95 transition zh-font"
              data-trad="🎲 隨機 5 主題" data-simp="🎲 随机 5 主题">🎲 隨機 5 主題</button>
            <button type="button" onclick="selectMixPreset('clear')"
              class="px-2.5 py-1.5 rounded-lg bg-white border border-[#E7E5E0] text-slate-500 text-xs font-semibold active:scale-95 transition zh-font"
              data-trad="清除" data-simp="清除">清除</button>
          </div>
        </div>

        <!-- Toggleable Topic Chips -->
        <div id="mixChipsContainer" class="flex flex-wrap gap-1.5 max-h-64 overflow-y-auto py-1">
          <!-- Populated by JS -->
        </div>

        <!-- Round Length Selector -->
        <div class="flex items-center justify-between gap-2 pt-2.5 border-t border-slate-100">
          <span class="text-xs font-bold text-slate-600 zh-font" data-trad="每輪題數" data-simp="每轮题数">每輪題數</span>
          <div class="inline-flex bg-[#F3F1EC] p-0.5 rounded-xl gap-0.5">
            <button type="button" onclick="setMixCount(10)" data-count="10" class="mix-cnt-btn px-3 py-1 rounded-lg text-xs font-bold transition">10</button>
            <button type="button" onclick="setMixCount(15)" data-count="15" class="mix-cnt-btn px-3 py-1 rounded-lg text-xs font-bold transition">15</button>
            <button type="button" onclick="setMixCount(20)" data-count="20" class="mix-cnt-btn px-3 py-1 rounded-lg text-xs font-bold transition">20</button>
            <button type="button" onclick="setMixCount(30)" data-count="30" class="mix-cnt-btn px-3 py-1 rounded-lg text-xs font-bold transition">30</button>
          </div>
        </div>

        <!-- Primary Start CTA -->
        <button id="startMixBtn" type="button" onclick="startMixRound()"
          class="w-full btn-primary text-white font-bold py-3.5 px-4 rounded-2xl text-sm sm:text-base zh-font flex items-center justify-center gap-2">
          <span>🚀</span>
          <span id="startMixBtnLabel">開始練習</span>
        </button>
      </div>
    </section>

    <!-- ==================== VIEW 2: GAMEPLAY ==================== -->
    <section id="gameView" class="hidden space-y-3 animate-pop">

      <!-- Top Progress & Stats Bar -->
      <div class="bg-white rounded-2xl px-3.5 py-2.5 border border-[#E7E5E0] shadow-sm space-y-2">
        <div class="flex items-center justify-between gap-2 text-xs">
          <button type="button" onclick="goHome()"
            class="flex items-center gap-1 font-bold text-slate-500 hover:text-slate-800 active:scale-95 transition">
            <span>←</span>
            <span data-trad="主題" data-simp="主题">主題</span>
          </button>

          <span id="gameHeaderTitle" class="font-bold text-slate-700 truncate zh-font">綜合混練</span>

          <div class="flex items-center gap-2 shrink-0 font-bold tabular-nums">
            <span id="gameStreakBadge" class="text-amber-600">🔥 0</span>
            <span id="gameProgressText" class="text-slate-500">1 / 10</span>
          </div>
        </div>
        <div class="w-full h-1.5 bg-[#EAE7E0] rounded-full overflow-hidden">
          <div id="gameProgressBar" class="h-full bg-gradient-to-r from-[#E05A47] to-[#2A8C82] rounded-full transition-all duration-300" style="width: 10%;"></div>
        </div>
      </div>

      <!-- Main Phrase Card -->
      <div id="phraseCard" class="bg-white rounded-2xl p-4 sm:p-5 border-2 border-[#E7E5E0] shadow-sm transition-all space-y-3.5">

        <!-- Badges Row -->
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span id="cardModeTag" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-[#E05A47]/10 text-[#E05A47] zh-font">
              拼音輸入
            </span>
            <span id="cardTopicTag" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 zh-font">
              🔢 數字
            </span>
          </div>

          <button id="inGameToneToggle" type="button" onclick="toggleRequireTones()"
            class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border transition shrink-0">
            需聲調 (wo3)
          </button>
        </div>

        <!-- Prompt Area -->
        <div class="text-center py-2 space-y-1.5">
          <!-- Phrase Display -->
          <div id="phraseDisplayWrap" class="min-h-[3.5rem] flex items-center justify-center">
            <div id="phraseChars" class="text-4xl sm:text-5xl font-bold tracking-wider text-slate-800 zh-font leading-snug break-words">
              你好
            </div>
          </div>

          <!-- Listening Mode Placeholder -->
          <div id="listeningPrompt" class="hidden py-1">
            <button type="button" onclick="speakCurrent(1.0)"
              class="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-[#2A8C82]/10 text-[#2A8C82] font-bold text-base active:scale-95 transition">
              <span class="text-2xl">🔊</span>
              <span class="zh-font" data-trad="點擊收聽普通話讀音" data-simp="点击收听普通话读音">點擊收聽普通話讀音</span>
            </button>
          </div>

          <!-- English Meaning -->
          <p id="phraseMeaning" class="text-sm text-slate-500 font-medium"></p>

          <!-- Audio Controls Row -->
          <div class="flex items-center justify-center gap-2 pt-1.5">
            <button type="button" onclick="speakCurrent(1.0)"
              class="btn-soft px-3.5 py-1.5 rounded-xl text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <span>🔊</span>
              <span class="zh-font" data-trad="正常 1.0x" data-simp="正常 1.0x">正常 1.0x</span>
            </button>
            <button type="button" onclick="speakCurrent(0.65)"
              class="btn-soft px-3.5 py-1.5 rounded-xl text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <span>🐢</span>
              <span class="zh-font" data-trad="慢速 0.65x" data-simp="慢速 0.65x">慢速 0.65x</span>
            </button>
          </div>
        </div>

        <!-- Hint Box -->
        <div id="hintBox" class="hidden bg-amber-50 border border-amber-200 rounded-xl px-3.5 py-2.5 text-center animate-pop">
          <span class="text-[11px] font-bold text-amber-700 uppercase tracking-wider mr-1.5" data-trad="提示" data-simp="提示">提示</span>
          <span id="hintContent" class="text-sm font-bold text-amber-900 font-mono"></span>
        </div>

        <!-- Feedback Banner (Shown in Review State) -->
        <div id="feedbackBanner" class="hidden rounded-xl px-3.5 py-2.5 text-sm font-bold text-center animate-pop"></div>

        <!-- Answer Breakdown Box (Shown on Show Answer or After Submit) -->
        <div id="answerBox" class="hidden bg-[#F8F7F4] border border-[#E7E5E0] rounded-2xl p-3 space-y-2 animate-pop">
          <div class="flex items-center justify-between text-[11px] font-bold text-slate-400">
            <span data-trad="標準答案與拼音拆解" data-simp="标准答案与拼音拆解">標準答案與拼音拆解</span>
            <span id="answerFullPlain" class="font-mono text-slate-500"></span>
          </div>
          <div id="answerPills" class="flex flex-wrap items-center justify-center gap-2">
            <!-- Character-by-character pills populated by JS -->
          </div>
        </div>

        <!-- Input Form -->
        <form id="answerForm" onsubmit="handleFormSubmit(event)" class="space-y-2.5 pt-1">
          <div class="flex items-center gap-2">
            <input
              id="answerInput"
              type="text"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="done"
              placeholder="輸入拼音，如 ni3 hao3"
              class="flex-1 min-w-0 bg-[#F8F7F4] border-2 border-[#E2DFD9] focus:bg-white focus:border-[#2A8C82] focus:outline-none rounded-xl px-3.5 py-3 text-base font-semibold text-slate-800 placeholder:text-slate-400 transition"
            />
            <button id="submitBtn" type="submit"
              class="btn-primary text-white font-bold px-5 py-3 rounded-xl text-sm sm:text-base shrink-0 zh-font">
              確認
            </button>
          </div>

          <!-- Secondary Action Row: Hint / Show Answer / Retry -->
          <div class="flex items-center justify-between gap-2 pt-0.5">
            <button id="hintBtn" type="button" onclick="showHint()"
              class="flex-1 btn-soft py-2 px-3 rounded-xl text-xs font-bold text-slate-600 flex items-center justify-center gap-1 zh-font">
              <span>💡</span>
              <span data-trad="提示" data-simp="提示">提示</span>
            </button>

            <button id="revealBtn" type="button" onclick="revealAnswer()"
              class="flex-1 btn-soft py-2 px-3 rounded-xl text-xs font-bold text-slate-600 flex items-center justify-center gap-1 zh-font">
              <span>👁️</span>
              <span data-trad="看答案" data-simp="看答案">看答案</span>
            </button>

            <button id="retryBtn" type="button" onclick="retryCurrentQuestion()"
              class="hidden flex-1 btn-soft py-2 px-3 rounded-xl text-xs font-bold text-amber-700 border-amber-200 bg-amber-50 flex items-center justify-center gap-1 zh-font">
              <span>↺</span>
              <span data-trad="重試此題" data-simp="重试此题">重試此題</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- ==================== VIEW 3: ROUND SUMMARY ==================== -->
    <section id="summaryView" class="hidden space-y-4 animate-pop">
      <div class="bg-white rounded-2xl p-5 border border-[#E7E5E0] shadow-sm text-center space-y-4">
        <div id="summaryStars" class="text-4xl tracking-widest">⭐⭐⭐</div>
        <div>
          <h2 id="summaryTitle" class="text-xl font-extrabold text-slate-800 zh-font">練習完成！</h2>
          <p id="summarySubtitle" class="text-xs text-slate-500 mt-1"></p>
        </div>

        <div class="grid grid-cols-3 gap-2.5 pt-1">
          <div class="bg-[#F8F7F4] rounded-xl p-3">
            <div id="sumAccuracy" class="text-xl font-extrabold text-[#2A8C82] tabular-nums">100%</div>
            <div class="text-[11px] font-semibold text-slate-500 mt-0.5" data-trad="正確率" data-simp="正确率">正確率</div>
          </div>
          <div class="bg-[#F8F7F4] rounded-xl p-3">
            <div id="sumScore" class="text-xl font-extrabold text-[#E05A47] tabular-nums">100</div>
            <div class="text-[11px] font-semibold text-slate-500 mt-0.5" data-trad="得分" data-simp="得分">得分</div>
          </div>
          <div class="bg-[#F8F7F4] rounded-xl p-3">
            <div id="sumStreak" class="text-xl font-extrabold text-amber-600 tabular-nums">10</div>
            <div class="text-[11px] font-semibold text-slate-500 mt-0.5" data-trad="最高連對" data-simp="最高连对">最高連對</div>
          </div>
        </div>

        <!-- Missed Phrases Review List -->

    /* ==========================================================
       3. PINYIN & PHRASE PARSING UTILITIES
       ========================================================== */
    const TONE_MAP = {
      a: ['ā', 'á', 'ǎ', 'à', 'a'],
      e: ['ē', 'é', 'ě', 'è', 'e'],
      i: ['ī', 'í', 'ǐ', 'ì', 'i'],
      o: ['ō', 'ó', 'ǒ', 'ò', 'o'],
      u: ['ū', 'ú', 'ǔ', 'ù', 'u'],
      ü: ['ǖ', 'ǘ', 'ǚ', 'ǜ', 'ü']
    };

    function numToToneMark(syl) {
      if (!syl) return '';
      // Keep uppercase Latin tokens like CD, DVD, T as-is
      if (/^[A-Z]+$/.test(syl)) return syl;
      const cleaned = syl.toLowerCase().replace(/u:|v/g, 'ü');
      const m = cleaned.match(/^([a-zü]+)([1-5])?$/);
      if (!m) return syl;
      const base = m[1];
      const tone = m[2] ? parseInt(m[2], 10) : 5;
      if (tone === 5) return base;

      let idx = -1;
      if (base.includes('a')) idx = base.indexOf('a');
      else if (base.includes('e')) idx = base.indexOf('e');
      else if (base.includes('ou')) idx = base.indexOf('o');
      else {
        for (let i = base.length - 1; i >= 0; i--) {
          if ('aeiouü'.includes(base[i])) { idx = i; break; }
        }
      }
      if (idx === -1) return base;
      const vowel = base[idx];
      const marked = TONE_MAP[vowel] ? TONE_MAP[vowel][tone - 1] : vowel;
      return base.slice(0, idx) + marked + base.slice(idx + 1);
    }

    function normalizeSyllable(syl) {
      return syl.toLowerCase().replace(/ü|u:/g, 'v').trim();
    }

    // Parse compact topic definitions into structured phrase objects
    const TOPICS = RAW_TOPICS.map(topic => {
      const phrases = topic.items.split(';').filter(Boolean).map(entry => {
        const [simpRaw, pyRaw, meaning] = entry.split('|');
        const simp = simpRaw.trim();
        const trad = toTrad(simp);
        // Extract pinyin tokens (strip punctuation)
        const pyTokens = pyRaw.replace(/[,，。？?!！]/g, ' ').trim().split(/\s+/).filter(Boolean);

        // Build display units aligning non-punctuation tokens with pinyin
        const units = [];
        let pyIdx = 0;
        let i = 0;
        while (i < simp.length) {
          const chS = simp[i];
          const chT = trad[i] || chS;

          // Group consecutive ASCII letters (e.g. CD, DVD, T)
          if (/[A-Za-z]/.test(chS)) {
            let word = '';
            while (i < simp.length && /[A-Za-z]/.test(simp[i])) {
              word += simp[i];
              i++;
            }
            const py = pyTokens[pyIdx++] || word;
            units.push({ s: word, t: word, py, mark: numToToneMark(py), isPunct: false });
            continue;
          }

          if (/[\s，,。？?!！]/.test(chS)) {
            if (chS !== ' ') {
              units.push({ s: chS, t: chT, py: '', mark: '', isPunct: true });
            }
            i++;
            continue;
          }

          const py = pyTokens[pyIdx++] || '';
          units.push({ s: chS, t: chT, py, mark: numToToneMark(py), isPunct: false });
          i++;
        }

        return {
          simp,
          trad,
          meaning: meaning ? meaning.trim() : '',
          pyTokens,
          units,
          topicId: topic.id,
          topicIcon: topic.icon,
          topicTitleTrad: topic.titleTrad,
          topicTitleSimp: topic.titleSimp
        };
      });

      return { ...topic, phrases };
    });

    function isTrad() { return state.script === 'trad'; }

    function loadSavedData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const d = JSON.parse(raw);
        if (d.script === 'trad' || d.script === 'simp') state.script = d.script;
        if (['pinyin', 'typing', 'listening'].includes(d.mode)) state.mode = d.mode;
        if (typeof d.requireTones === 'boolean') state.requireTones = d.requireTones;
        if (typeof d.flashMode === 'boolean') state.flashMode = d.flashMode;
        if (typeof d.sfxEnabled === 'boolean') state.sfxEnabled = d.sfxEnabled;
        if ([10, 15, 20, 30].includes(d.mixCount)) state.mixCount = d.mixCount;
        if (Array.isArray(d.selectedTopicIds)) {
          const valid = new Set(TOPICS.map(t => t.id));
          const filtered = d.selectedTopicIds.filter(id => valid.has(id));
          if (filtered.length > 0) state.selectedTopicIds = filtered;
        }
      } catch (e) {
        console.warn('Could not load saved state:', e);
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          script: state.script,
          mode: state.mode,
          requireTones: state.requireTones,
          flashMode: state.flashMode,
          sfxEnabled: state.sfxEnabled,
          mixCount: state.mixCount,
          selectedTopicIds: state.selectedTopicIds
        }));
      } catch (e) {
        console.warn('Could not save state:', e);
      }
    }

    /* ==========================================================
       5. AUDIO (WEB AUDIO SFX + MANDARIN TTS)
       ========================================================== */
    let audioCtx = null;

    function playSfx(type) {
      if (!state.sfxEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'wrong') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(185, now + 0.1);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (type === 'finish') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      } catch (e) {}
    }

    let mandarinVoice = null;
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      mandarinVoice =
        voices.find(v => /zh[-_]CN/i.test(v.lang) && /Tingting|Mei-Jia|Google|Microsoft|Xiaoxiao/i.test(v.name)) ||
        voices.find(v => /zh[-_]CN/i.test(v.lang)) ||
        voices.find(v => /zh[-_]TW/i.test(v.lang)) ||
        voices.find(v => /^zh/i.test(v.lang)) || null;
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text, rate = 1.0) {
      if (!('speechSynthesis' in window)) {
        showToast(isTrad() ? '此瀏覽器不支援語音朗讀' : '此浏览器不支持语音朗读');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-CN';
        utter.rate = rate;
        if (mandarinVoice) utter.voice = mandarinVoice;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function speakCurrent(rate = 1.0) {
      const phrase = state.queue[state.currentIndex];
      if (!phrase) return;
      speakText(phrase.simp, rate);
    }

        inGameTone.textContent = state.requireTones
          ? (trad ? '需聲調 (wo3)' : '需声调 (wo3)')
          : (trad ? '免聲調 (wo)' : '免声调 (wo)');
        inGameTone.className = state.requireTones
          ? 'text-[11px] font-bold px-2.5 py-0.5 rounded-full border transition shrink-0 bg-[#2A8C82]/10 border-[#2A8C82]/30 text-[#2A8C82]'
          : 'text-[11px] font-bold px-2.5 py-0.5 rounded-full border transition shrink-0 bg-slate-100 border-slate-200 text-slate-500';
      }

      if (homeFlash) {
        homeFlash.textContent = state.flashMode
          ? (trad ? '開啟' : '开启')
          : (trad ? '關閉' : '关闭');
        homeFlash.className = state.flashMode
          ? 'px-3 py-1 rounded-full text-xs font-bold transition bg-[#2A8C82] text-white'
          : 'px-3 py-1 rounded-full text-xs font-bold transition bg-slate-200 text-slate-600';
      }
    }

    /* ==========================================================
       7. MIXED TOPICS PICKER LOGIC
       ========================================================== */
    function getSelectedUniquePool() {
      const selected = new Set(state.selectedTopicIds);
      const seen = new Set();
      const pool = [];
      TOPICS.forEach(t => {
        if (!selected.has(t.id)) return;
        t.phrases.forEach(p => {
          if (seen.has(p.simp)) return;
          seen.add(p.simp);
          pool.push(p);
        });
      });
      return pool;
    }

    function setTopicSearch(val) {
      state.topicSearch = val.trim().toLowerCase();
      renderMixPanel();
    }

    function toggleTopic(topicId) {
      const idx = state.selectedTopicIds.indexOf(topicId);
      if (idx >= 0) state.selectedTopicIds.splice(idx, 1);
      else state.selectedTopicIds.push(topicId);
      saveData();
      renderMixPanel();
    }

    function selectMixPreset(preset) {
      const trad = isTrad();
      if (preset === 'all') {
        state.selectedTopicIds = TOPICS.map(t => t.id);
      } else if (preset === 'daily') {
        state.selectedTopicIds = TOPICS.filter(t => t.daily).map(t => t.id);
      } else if (preset === 'random5') {
        state.selectedTopicIds = shuffleArray(TOPICS).slice(0, 5).map(t => t.id);
        showToast(trad ? '🎲 已隨機抽選 5 個主題' : '🎲 已随机抽选 5 个主题');
      } else if (preset === 'clear') {
        state.selectedTopicIds = [];
      }
      saveData();
      renderMixPanel();
    }

    function setMixCount(cnt) {
      state.mixCount = cnt;
      saveData();
      renderMixPanel();
    }

    function renderMixPanel() {
      const trad = isTrad();
      const container = document.getElementById('mixChipsContainer');
      const poolBadge = document.getElementById('mixPoolBadge');
      const startBtn = document.getElementById('startMixBtn');
      const startLabel = document.getElementById('startMixBtnLabel');

      // Highlight round count buttons
      document.querySelectorAll('.mix-cnt-btn').forEach(btn => {
        const cnt = parseInt(btn.getAttribute('data-count'), 10);
        btn.className = cnt === state.mixCount
          ? 'mix-cnt-btn px-3 py-1 rounded-lg text-xs font-bold transition bg-white text-[#E05A47] shadow-sm'
          : 'mix-cnt-btn px-3 py-1 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-700';
      });

      const selectedSet = new Set(state.selectedTopicIds);
      const q = state.topicSearch;
      container.innerHTML = '';

      const filteredTopics = TOPICS.filter(t => {
        if (!q) return true;
        return t.titleTrad.toLowerCase().includes(q) ||
               t.titleSimp.toLowerCase().includes(q) ||
               t.id.toLowerCase().includes(q);
      });

      if (filteredTopics.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 py-2">${trad ? '找不到符合的主題' : '找不到符合的主题'}</p>`;
      } else {
        filteredTopics.forEach(t => {
          const active = selectedSet.has(t.id);
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.onclick = () => toggleTopic(t.id);
          chip.className = active
            ? 'px-2.5 py-1.5 rounded-xl text-xs font-bold transition active:scale-95 flex items-center gap-1 border bg-[#E05A47]/10 border-[#E05A47]/45 text-[#C84735] zh-font'
            : 'px-2.5 py-1.5 rounded-xl text-xs font-semibold transition active:scale-95 flex items-center gap-1 border bg-[#F8F7F4] border-[#E7E5E0] text-slate-500 zh-font';
          chip.innerHTML = `
            <span>${active ? '✓' : '+'}</span>
            <span>${t.icon} ${trad ? t.titleTrad : t.titleSimp}</span>
            <span class="text-[10px] opacity-65">(${t.phrases.length})</span>
          `;
          container.appendChild(chip);
        });
      }

      const pool = getSelectedUniquePool();
      const topicCount = state.selectedTopicIds.length;
      poolBadge.textContent = trad ? `${pool.length} 詞可用` : `${pool.length} 词可用`;

      const actualCount = Math.min(state.mixCount, pool.length);
      if (topicCount === 0 || pool.length === 0) {
        startBtn.disabled = true;
        startBtn.classList.add('opacity-50', 'cursor-not-allowed');
        startLabel.textContent = trad ? '請至少選擇 1 個主題' : '请至少选择 1 个主题';
      } else {
        startBtn.disabled = false;
        startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        if (topicCount === 1) {
          const single = TOPICS.find(t => t.id === state.selectedTopicIds[0]);
          const tName = single ? (trad ? single.titleTrad : single.titleSimp) : '';
          startLabel.textContent = trad
            ? `開始練習「${tName}」（${actualCount} 題）`
            : `开始练习「${tName}」（${actualCount} 题）`;
        } else {
          startLabel.textContent = trad
            ? `開始綜合混練（${topicCount} 主題 · ${actualCount} 題）`
            : `开始综合混练（${topicCount} 主题 · ${actualCount} 题）`;
        }
      }
    }

    /* ==========================================================
       8. GAMEPLAY LIFECYCLE & REVIEW-FIRST SUBMISSION
       ========================================================== */
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function resetRoundStats() {
      state.currentIndex = 0;
      state.score = 0;
      state.streak = 0;
      state.bestStreak = 0;
      state.correctCount = 0;
      state.missedInRound = [];
    }

    function startMixRound() {
      const pool = getSelectedUniquePool();
      if (pool.length === 0) {
        showToast(isTrad() ? '請至少選擇 1 個主題' : '请至少选择 1 个主题');
        return;
      }
      state.isReviewRound = false;
      state.queue = shuffleArray(pool).slice(0, Math.min(state.mixCount, pool.length));
      resetRoundStats();
      showView('gameView');
      loadQuestion();
    }

    function startMissedReview() {
      if (state.missedInRound.length === 0) return;
      state.isReviewRound = true;
      state.queue = shuffleArray(state.missedInRound);
      resetRoundStats();
      showView('gameView');
      loadQuestion();
    }

    function loadQuestion() {
      clearTimeout(state.flashTimer);
      const phrase = state.queue[state.currentIndex];
      if (!phrase) return;

      const trad = isTrad();
      state.hintStage = 0;
      state.wrongAttempts = 0;
      state.inReview = false;
      state.hadMistakeOnCurrent = false;

      // Header progress
      const total = state.queue.length;
      const cur = state.currentIndex + 1;
      document.getElementById('gameHeaderTitle').textContent = state.isReviewRound
        ? (trad ? '🔁 錯題複習' : '🔁 错题复习')
        : (trad ? `🔀 綜合混練 (${state.selectedTopicIds.length} 主題)` : `🔀 综合混练 (${state.selectedTopicIds.length} 主题)`);
      document.getElementById('gameStreakBadge').textContent = `🔥 ${state.streak}`;
      document.getElementById('gameProgressText').textContent = `${cur} / ${total}`;
      document.getElementById('gameProgressBar').style.width = `${Math.round((cur / total) * 100)}%`;

      // Mode & Topic badges
      const modeTag = document.getElementById('cardModeTag');
      if (state.mode === 'pinyin') modeTag.textContent = trad ? '⌨️ 拼音輸入' : '⌨️ 拼音输入';
      else if (state.mode === 'typing') modeTag.textContent = '✍️ 中文打字';
      else modeTag.textContent = trad ? '🎧 聽寫挑戰' : '🎧 听写挑战';

      document.getElementById('cardTopicTag').textContent = `${phrase.topicIcon} ${trad ? phrase.topicTitleTrad : phrase.topicTitleSimp}`;
      updateOptionToggles();

      // Phrase display & adaptive font sizing for longer idioms/proverbs
      const text = trad ? phrase.trad : phrase.simp;
      const charsEl = document.getElementById('phraseChars');
      charsEl.textContent = text;
      charsEl.classList.remove('flash-blur');

      if (text.length >= 10) {
        charsEl.className = 'text-xl sm:text-2xl font-bold tracking-wide text-slate-800 zh-font leading-snug break-words';
      } else if (text.length >= 6) {
        charsEl.className = 'text-2xl sm:text-3xl font-bold tracking-wide text-slate-800 zh-font leading-snug break-words';
      } else {
        charsEl.className = 'text-4xl sm:text-5xl font-bold tracking-wider text-slate-800 zh-font leading-snug break-words';
      }

      // Listening vs Visual prompt
      const isListening = state.mode === 'listening';
      document.getElementById('phraseDisplayWrap').classList.toggle('hidden', isListening);
      document.getElementById('listeningPrompt').classList.toggle('hidden', !isListening);
      document.getElementById('phraseMeaning').textContent = isListening ? '' : phrase.meaning;

      // Flash memory blur in Chinese Typing mode
      if (state.mode === 'typing' && state.flashMode) {
        state.flashTimer = setTimeout(() => {
          if (!state.inReview) charsEl.classList.add('flash-blur');
        }, 2000);
      }

      // Reset card visual states
      const card = document.getElementById('phraseCard');
      card.classList.remove('border-emerald-400', 'border-rose-400', 'animate-shake');
      card.classList.add('border-[#E7E5E0]');

      document.getElementById('hintBox').classList.add('hidden');
      document.getElementById('feedbackBanner').classList.add('hidden');
      document.getElementById('answerBox').classList.add('hidden');
      document.getElementById('hintBtn').classList.remove('hidden');
      document.getElementById('revealBtn').classList.remove('hidden');
      document.getElementById('retryBtn').classList.add('hidden');

      const input = document.getElementById('answerInput');
      input.value = '';
      input.readOnly = false;
      input.classList.remove('bg-slate-100', 'text-slate-500');
      updateInputPlaceholder();
      updateSubmitButtonUI();

      // Auto-play audio in Listening mode
      if (isListening) {
        setTimeout(() => speakCurrent(1.0), 220);
      }
    }

    function updateInputPlaceholder() {
      const input = document.getElementById('answerInput');
      const trad = isTrad();
      if (state.mode === 'pinyin') {
        input.placeholder = state.requireTones
          ? (trad ? '輸入拼音加聲調，如 ni3 hao3' : '输入拼音加声调，如 ni3 hao3')
          : (trad ? '輸入拼音（免聲調），如 ni hao' : '输入拼音（免声调），如 ni hao');
      } else if (state.mode === 'typing') {
        input.placeholder = trad ? '用中文輸入法打出詞語...' : '用中文输入法打出词语...';
      } else {
        input.placeholder = state.requireTones
          ? (trad ? '輸入拼音 (ni3 hao3) 或漢字...' : '输入拼音 (ni3 hao3) 或汉字...')
          : (trad ? '輸入拼音 (ni hao) 或漢字...' : '输入拼音 (ni hao) 或汉字...');
      }
    }

    function updateSubmitButtonUI() {
      const btn = document.getElementById('submitBtn');
      const trad = isTrad();
      if (state.inReview) {
        const isLast = state.currentIndex >= state.queue.length - 1;
        btn.textContent = isLast
          ? (trad ? '查看成績 →' : '查看成绩 →')
          : (trad ? '下一題 →' : '下一题 →');
        btn.className = 'btn-jade text-white font-bold px-5 py-3 rounded-xl text-sm sm:text-base shrink-0 zh-font';
      } else {
        btn.textContent = trad ? '確認' : '确认';
        btn.className = 'btn-primary text-white font-bold px-5 py-3 rounded-xl text-sm sm:text-base shrink-0 zh-font';
      }
    }

    function refreshCurrentCardText() {
      const phrase = state.queue[state.currentIndex];
      if (!phrase) return;
      const trad = isTrad();
      document.getElementById('phraseChars').textContent = trad ? phrase.trad : phrase.simp;
      document.getElementById('cardTopicTag').textContent = `${phrase.topicIcon} ${trad ? phrase.topicTitleTrad : phrase.topicTitleSimp}`;
      if (!document.getElementById('answerBox').classList.contains('hidden')) {
        renderAnswerBreakdown(phrase);
      }
      updateInputPlaceholder();
      updateSubmitButtonUI();
    }

    /* ==========================================================
       9. ANSWER MATCHING (PINYIN + TONE SANDHI + CHINESE)
       ========================================================== */
    function stripPunctAndSpaces(str) {
      return str.replace(/[\s，,。？?!！、；;：:'"“”‘’\-]/g, '');
    }

    function checkChineseMatch(userInput, phrase) {
      const u = stripPunctAndSpaces(userInput).toLowerCase();
      if (!u) return false;
      const s = stripPunctAndSpaces(phrase.simp).toLowerCase();
      const t = stripPunctAndSpaces(phrase.trad).toLowerCase();
      return u === s || u === t;
    }

    function buildPinyinRegex(phrase, requireTones) {
      const nonPunctUnits = phrase.units.filter(u => !u.isPunct);
      const parts = nonPunctUnits.map((u, idx) => {
        const norm = normalizeSyllable(u.py);
        // Handle uppercase English letters like CD, DVD, T
        if (/^[a-z]+$/.test(norm) && /^[A-Z]+$/.test(u.s)) {
          return norm;
        }
        const m = norm.match(/^([a-zv]+)([1-5])?$/);
        if (!m) return norm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const base = m[1];
        const tone = m[2] || '5';

        if (!requireTones) {
          return `${base}[1-5]?`;
        }

        // Tone sandhi tolerance for 一 (yi1/yi2/yi4) and 不 (bu4/bu2) in multi-char phrases
        if (nonPunctUnits.length > 1) {
          if (u.s === '一' && base === 'yi') return `yi[124]`;
          if (u.s === '不' && base === 'bu') return `bu[24]`;
        }
        // Neutral tone: accept 5 or omitted digit
        if (tone === '5') return `${base}5?`;
        return `${base}${tone}`;
      });
      return new RegExp('^' + parts.join('') + '$', 'i');
    }

    function checkPinyinMatch(userInput, phrase, requireTones) {
      const cleaned = stripPunctAndSpaces(userInput).toLowerCase().replace(/ü|u:/g, 'v');
      if (!cleaned) return false;
      const regex = buildPinyinRegex(phrase, requireTones);
      return regex.test(cleaned);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      // If already in review state, advance to next question
      if (state.inReview) {
        goNextQuestion();
        return;
      }

      const input = document.getElementById('answerInput');
      const val = input.value.trim();
      if (!val) {
        showToast(isTrad() ? '請先輸入答案' : '请先输入答案');
        input.focus();
        return;
      }

      const phrase = state.queue[state.currentIndex];
      let isCorrect = false;

      if (state.mode === 'pinyin') {
        isCorrect = checkPinyinMatch(val, phrase, state.requireTones);
      } else if (state.mode === 'typing') {
        isCorrect = checkChineseMatch(val, phrase);
      } else {
        // Listening mode accepts either Pinyin or Chinese characters
        isCorrect = checkChineseMatch(val, phrase) || checkPinyinMatch(val, phrase, state.requireTones);
      }

      if (isCorrect) {
        enterReviewState(true, val, false);
      } else {
        handleWrongAttempt(val);
      }
    }

    function handleWrongAttempt(userTyped) {
      const phrase = state.queue[state.currentIndex];
      const trad = isTrad();
      const card = document.getElementById('phraseCard');
      const banner = document.getElementById('feedbackBanner');
      const input = document.getElementById('answerInput');

      state.wrongAttempts++;
      state.hadMistakeOnCurrent = true;
      state.streak = 0;
      document.getElementById('gameStreakBadge').textContent = '🔥 0';

      if (!state.missedInRound.some(p => p.simp === phrase.simp)) {
        state.missedInRound.push(phrase);
      }

      playSfx('wrong');
      card.classList.remove('border-[#E7E5E0]', 'border-emerald-400');
      card.classList.add('border-rose-400', 'animate-shake');
      setTimeout(() => card.classList.remove('animate-shake'), 350);

      banner.className = 'rounded-xl px-3.5 py-2.5 text-sm font-bold text-center animate-pop bg-rose-50 text-rose-700 border border-rose-200 zh-font';
      banner.textContent = trad
        ? `❌ 還差一點，再試一次！（已試 ${state.wrongAttempts} 次，需要時可按「提示」或「看答案」）`
        : `❌ 还差一点，再试一次！（已试 ${state.wrongAttempts} 次，需要时可按「提示」或「看答案」）`;

      input.focus();
    }

    function enterReviewState(isCorrect, userTyped, wasRevealed) {
      clearTimeout(state.flashTimer);
      state.inReview = true;

      const phrase = state.queue[state.currentIndex];
      const trad = isTrad();
      const card = document.getElementById('phraseCard');
      const banner = document.getElementById('feedbackBanner');
      const input = document.getElementById('answerInput');

      // Reveal hidden text (Listening or Flash Memory)
      document.getElementById('phraseDisplayWrap').classList.remove('hidden');
      document.getElementById('listeningPrompt').classList.add('hidden');
      document.getElementById('phraseChars').classList.remove('flash-blur');
      document.getElementById('phraseMeaning').textContent = phrase.meaning;

      // Lock input during review so user can inspect the answer calmly
      input.readOnly = true;
      input.classList.add('bg-slate-100', 'text-slate-500');
      input.blur();

      // Always show full character-by-character Pinyin breakdown
      renderAnswerBreakdown(phrase);

      if (isCorrect) {
        playSfx('correct');
        if (!state.hadMistakeOnCurrent) {
          state.correctCount++;
          state.streak++;
          if (state.streak > state.bestStreak) state.bestStreak = state.streak;
          const pts = state.hintStage === 0 ? 10 : (state.hintStage === 1 ? 7 : 5);
          state.score += pts + Math.min(state.streak, 5);
        }
        document.getElementById('gameStreakBadge').textContent = `🔥 ${state.streak}`;
        card.classList.remove('border-[#E7E5E0]', 'border-rose-400');
        card.classList.add('border-emerald-400');

        banner.className = 'rounded-xl px-3.5 py-2.5 text-sm font-bold text-center animate-pop bg-emerald-50 text-emerald-700 border border-emerald-200 zh-font';
        banner.textContent = trad ? '✅ 答對了！核對下方讀音後按「下一題」' : '✅ 答对了！核对下方读音后按「下一题」';
        document.getElementById('retryBtn').classList.add('hidden');
      } else {
        playSfx('wrong');
        state.hadMistakeOnCurrent = true;
        state.streak = 0;
        document.getElementById('gameStreakBadge').textContent = `🔥 0`;
        if (!state.missedInRound.some(p => p.simp === phrase.simp)) {
          state.missedInRound.push(phrase);
        }

        card.classList.remove('border-[#E7E5E0]', 'border-emerald-400');
        card.classList.add('border-rose-400', 'animate-shake');
        setTimeout(() => card.classList.remove('animate-shake'), 350);

        banner.className = 'rounded-xl px-3.5 py-2.5 text-sm font-bold text-center animate-pop bg-rose-50 text-rose-700 border border-rose-200 zh-font';
        if (wasRevealed) {
          banner.textContent = trad ? '👁️ 已顯示答案，聽一遍讀音再繼續吧！' : '👁️ 已显示答案，听一遍读音再继续吧！';
        } else {
          banner.textContent = trad
            ? `❌ 你的輸入：「${userTyped}」— 請核對正確拼音`
            : `❌ 你的输入：「${userTyped}」— 请核对正确拼音`;
        }
        document.getElementById('retryBtn').classList.remove('hidden');
      }

      document.getElementById('hintBtn').classList.add('hidden');
      document.getElementById('revealBtn').classList.add('hidden');
      updateSubmitButtonUI();
    }

    function retryCurrentQuestion() {
      const input = document.getElementById('answerInput');
      state.inReview = false;
      input.readOnly = false;
      input.value = '';
      input.classList.remove('bg-slate-100', 'text-slate-500');
      document.getElementById('feedbackBanner').classList.add('hidden');
      document.getElementById('retryBtn').classList.add('hidden');
      document.getElementById('phraseCard').classList.remove('border-rose-400');
      document.getElementById('phraseCard').classList.add('border-[#E7E5E0]');
      updateSubmitButtonUI();
      input.focus();
    }

    function renderAnswerBreakdown(phrase) {
      const trad = isTrad();
      const box = document.getElementById('answerBox');
      const pills = document.getElementById('answerPills');
      const plain = document.getElementById('answerFullPlain');

      plain.textContent = phrase.pyTokens.join(' ');
      pills.innerHTML = '';

      phrase.units.forEach(u => {
        if (u.isPunct) {
          const span = document.createElement('span');
          span.className = 'text-lg font-bold text-slate-400 self-center';
          span.textContent = trad ? u.t : u.s;
          pills.appendChild(span);
          return;
        }
        const pill = document.createElement('div');
        pill.className = 'bg-white border border-[#E5E2DC] rounded-xl px-2.5 py-1.5 text-center min-w-[3.2rem] shadow-xs';
        pill.innerHTML = `
          <div class="text-xs font-bold text-[#2A8C82]">${u.mark}</div>
          <div class="text-xl font-bold text-slate-800 zh-font leading-tight my-0.5">${trad ? u.t : u.s}</div>
          <div class="text-[10px] font-mono text-slate-400">${u.py}</div>
        `;
        pills.appendChild(pill);
      });

      box.classList.remove('hidden');
    }

    function showHint() {
      const phrase = state.queue[state.currentIndex];
      if (!phrase || state.inReview) return;
      state.hintStage++;

      const box = document.getElementById('hintBox');
      const content = document.getElementById('hintContent');
      const nonPunct = phrase.units.filter(u => !u.isPunct);
      const hasV = nonPunct.some(u => normalizeSyllable(u.py).includes('v'));
      const vNote = hasV ? '  (ü → v)' : '';

      if (state.hintStage === 1) {
        // Stage 1: First syllable + remaining initials
        const parts = nonPunct.map((u, idx) => {
          if (idx === 0) return state.requireTones ? u.py : u.py.replace(/[1-5]/g, '');
          return u.py[0] + '…';
        });
        content.textContent = parts.join(' ') + vNote;
      } else {
        // Stage 2: Tone-marked pinyin without numbers (or full pinyin if typing mode)
        content.textContent = nonPunct.map(u => u.mark).join(' ') + vNote;
      }
      box.classList.remove('hidden');
    }

    function revealAnswer() {
      if (state.inReview) return;
      enterReviewState(false, '', true);
      speakCurrent(1.0);
    }

    function goNextQuestion() {
      if (state.currentIndex + 1 < state.queue.length) {
        state.currentIndex++;
        loadQuestion();
      } else {
        showSummary();
      }
    }

    /* ==========================================================
       10. ROUND SUMMARY
       ========================================================== */
    function showSummary() {
      playSfx('finish');
      const trad = isTrad();
      const total = state.queue.length;
      const accuracy = total > 0 ? Math.round((state.correctCount / total) * 100) : 0;
      const stars = accuracy >= 90 ? '⭐⭐⭐' : accuracy >= 70 ? '⭐⭐' : '⭐';

      document.getElementById('summaryStars').textContent = stars;
      document.getElementById('summaryTitle').textContent = accuracy >= 90
        ? (trad ? '太棒了！表現出色！' : '太棒了！表现出色！')
        : accuracy >= 70
          ? (trad ? '做得好！繼續保持！' : '做得好！继续保持！')
          : (trad ? '練習完成！多聽多打更熟練！' : '练习完成！多听多打更熟练！');

      document.getElementById('summarySubtitle').textContent = state.isReviewRound
        ? (trad ? '錯題複習完成' : '错题复习完成')
        : (trad ? `🔀 綜合混練 · ${state.selectedTopicIds.length} 個主題 · ${total} 題` : `🔀 综合混练 · ${state.selectedTopicIds.length} 个主题 · ${total} 题`);

      document.getElementById('sumAccuracy').textContent = `${accuracy}%`;
      document.getElementById('sumScore').textContent = state.score;
      document.getElementById('sumStreak').textContent = state.bestStreak;

      const missedSection = document.getElementById('missedSection');
      const missedList = document.getElementById('missedList');
      const reviewBtn = document.getElementById('reviewMissedBtn');

      if (state.missedInRound.length > 0) {
        missedSection.classList.remove('hidden');
        reviewBtn.classList.remove('hidden');
        reviewBtn.textContent = trad
          ? `🔁 複習這 ${state.missedInRound.length} 個錯題`
          : `🔁 复习这 ${state.missedInRound.length} 个错题`;
        document.getElementById('missedCountBadge').textContent = `${state.missedInRound.length} ${trad ? '題' : '题'}`;

        missedList.innerHTML = '';
        state.missedInRound.forEach(p => {
          const row = document.createElement('div');
          row.className = 'flex items-center justify-between gap-2 bg-[#F8F7F4] rounded-xl px-3 py-2';
          row.innerHTML = `
            <div class="min-w-0">
              <div class="font-bold text-sm text-slate-800 zh-font">
                ${trad ? p.trad : p.simp}
                <span class="text-xs font-semibold text-[#2A8C82] ml-1">${p.units.filter(u => !u.isPunct).map(u => u.mark).join(' ')}</span>
              </div>
              <div class="text-[11px] text-slate-500 truncate">${p.pyTokens.join(' ')} · ${p.meaning}</div>
            </div>
            <button type="button" onclick="speakText('${p.simp.replace(/'/g, "\\'")}', 0.85)"
              class="w-8 h-8 rounded-lg bg-white border border-[#E5E2DC] flex items-center justify-center shrink-0 active:scale-95">
              🔊
            </button>
          `;
          missedList.appendChild(row);
        });
      } else {
        missedSection.classList.add('hidden');
        reviewBtn.classList.add('hidden');
      }

      showView('summaryView');
    }

    /* ==========================================================
       11. INITIALIZE APP
       ========================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedData();
      document.getElementById('sfxToggleBtn').textContent = state.sfxEnabled ? '🔊' : '🔇';
      applyScriptToDOM();
      updateModeUI();
      updateOptionToggles();
      renderMixPanel();
    });
  </script>
</body>
</html>
